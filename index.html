<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>数学口算闪算 · 极速特训版</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>⚡ 数学口算闪算练习</h1>
    <div class="subhead">
      自动静默同步 · 闪算模式 
      <span class="auto-badge" id="timerBadge">⏱️ 00:00</span>
    </div>

    <!-- 错题本入口 -->
    <div class="top-action-bar">
      <button class="btn btn-warning btn-block" id="wrongProblemsBtn">⚠️ 查看数学错题本</button>
    </div>

    <!-- 级别与计时设置面板 -->
    <div class="panel">
      <div class="panel-title"><span>📊 选择计算级别 (Level)</span></div>
      <div class="select-item" style="margin-bottom: 12px;">
        <select id="levelSelect" class="form-select">
          <option value="">请选择训练级别</option>
          <option value="1">Level 1: 十以内加减法全量穷举</option>
          <option value="2">Level 2: 二十以内加减法全量穷举</option>
          <option value="3">Level 3: 100 以内不进位加减法全量穷举</option>
          <option value="4">Level 4: 100 以内进位加减法全量穷举</option>
        </select>
      </div>

      <!-- 计时器控制栏 -->
      <div class="timer-control-bar">
        <span style="font-size: 0.85rem; font-weight: 600; color: #4a5b6f;">⏱️ 倒计时:</span>
        <input type="number" id="customMinutesInput" class="form-input-number" value="3" min="1" max="120">
        <span style="font-size: 0.85rem; color: #4a5b6f;">分钟</span>
        <button class="btn btn-primary" id="startTimerBtn" style="flex: none; padding: 8px 12px; font-size: 0.85rem;">开始</button>
        <button class="btn" id="pauseTimerBtn" style="flex: none; padding: 8px 12px; font-size: 0.85rem; background: #fef3c7; color: #b45309; border-color: #fde68a;" disabled>暂停</button>
        <button class="btn" id="stopTimerBtn" style="flex: none; padding: 8px 12px; font-size: 0.85rem; background: #fee2e2; color: #b91c1c; border-color: #fca5a5;">停止</button>
      </div>
    </div>

    <!-- 题目卡片挂载容器 -->
    <div id="problemsContainer"></div>

    <div class="status-msg" id="statusMsg"></div>
    <div class="footer-note">无需输入结果 · 勾选对错与2秒内完成 · 点击“下一题”自动静默同步保存</div>
  </div>

  <!-- 时间到弹出的提示模态框 -->
  <div id="timeUpModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-icon">⏰</div>
      <h2>时间到啦！</h2>
      <p>本次口算闪算时间已结束，真棒！去核对一下刚才的战绩吧。</p>
      <button class="btn btn-primary btn-block" id="closeModalBtn" style="margin-top: 16px;">我知道了</button>
    </div>
  </div>

  <!-- 引入 SheetJS 和 Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
